name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq || true

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests
        run: make test-integration

      - name: Run output tests
        run: make test-output

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on main script
        run: shellcheck --severity=warning molt-security-audit.sh

      - name: Run ShellCheck on test helper
        run: shellcheck --severity=warning test/test_helper/common-setup.bash || true

  audit-self-test:
    name: Self Audit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run security audit (JSON mode)
        run: |
          chmod +x molt-security-audit.sh
          # Script may exit 1 (failures) or 2 (warnings) - that's expected on CI
          ./molt-security-audit.sh --json > audit-results.json || true
          echo "=== Audit Results ==="
          cat audit-results.json

      - name: Validate JSON output
        run: |
          if ! jq . audit-results.json > /dev/null 2>&1; then
            echo "ERROR: Invalid JSON output"
            cat audit-results.json
            exit 1
          fi
          echo "JSON output is valid"

      - name: Check for required fields
        run: |
          jq -e '.version' audit-results.json > /dev/null
          jq -e '.timestamp' audit-results.json > /dev/null
          jq -e '.summary.pass' audit-results.json > /dev/null
          jq -e '.summary.fail' audit-results.json > /dev/null
          jq -e '.summary.warn' audit-results.json > /dev/null
          jq -e '.summary.skip' audit-results.json > /dev/null
          jq -e '.summary.risk_score' audit-results.json > /dev/null
          echo "All required fields present"

      - name: Display summary
        run: |
          echo "=== Summary ==="
          jq '.summary' audit-results.json
